<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家庭食谱">
<meta name="theme-color" content="#FFF9F4">
<title>My Family Kitchen · 我的家庭食谱</title>
<style>
:root{
  --bg:#FFF9F4;
  --card:#FFFFFF;
  --ink:#2B2118;
  --muted:#8B7D70;
  --line:#EFE3D8;
  --accent:#F26B3A;
  --accent-soft:#FFEDE4;
  --green:#3F9E71;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
input,textarea,button,select{font-family:inherit;font-size:16px;}
button{border:none;background:none;color:inherit;cursor:pointer;padding:0;}
input,textarea,select{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:10px 12px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,107,58,.12);}
textarea{resize:vertical;line-height:1.45;}
input::placeholder,textarea::placeholder{color:#BFB2A6;}

/* ---------- 页面 ---------- */
.page{display:none;padding-bottom:calc(96px + env(safe-area-inset-bottom));}
.page.active{display:block;}
.page-head{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;
  background:rgba(255,249,244,.88);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
}
.page-head h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.3px;}
.page-body{padding:0 16px;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;box-shadow:0 4px 12px -4px rgba(242,107,58,.7);
}
.icon-btn:active{transform:scale(.94);}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(43,33,24,.05),0 8px 20px -16px rgba(43,33,24,.35);
}
.muted{color:var(--muted);font-size:13.5px;line-height:1.5;}
.section-label{
  font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.6px;
  margin:18px 0 8px;
}

/* ---------- 底部导航 ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;
  padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 0 3px;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.1px;
}
.tab .ico{font-size:19px;line-height:1.05;opacity:.6;transition:opacity .15s,transform .15s;}
.tab.active{color:var(--accent);font-weight:700;}
.tab.active .ico{opacity:1;transform:translateY(-1px);}
.tab:active .ico{transform:scale(.9);}

/* ---------- 食谱 ---------- */
.search{margin-bottom:12px;background:#fff;}
.recipe-card{
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--radius);
  padding:10px;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(43,33,24,.05),0 8px 20px -16px rgba(43,33,24,.35);
}
.recipe-card:active{transform:scale(.985);}
.thumb{
  width:66px;height:66px;border-radius:12px;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex:0 0 auto;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.rc-body{flex:1;min-width:0;}
.rc-title{font-weight:700;font-size:16px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rc-sub{font-size:12.5px;color:var(--muted);}
.chev{color:#D8CBC0;font-size:20px;padding-right:4px;}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-ico{font-size:46px;margin-bottom:12px;opacity:.8;}
.empty p{margin:0;font-size:14px;line-height:1.7;}

/* ---------- 日期导航 ---------- */
.date-nav,.week-nav{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 16px 12px;
}
.nav-btn{
  width:36px;height:36px;border-radius:50%;background:#fff;color:var(--muted);
  font-size:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(43,33,24,.06);flex:0 0 auto;
}
.nav-btn:active{background:var(--accent-soft);color:var(--accent);}
.date-nav input[type=date]{
  flex:1;text-align:center;border:none;background:transparent;
  font-size:16px;font-weight:700;color:var(--ink);padding:6px;
}
.week-label{font-size:15px;font-weight:700;text-align:center;flex:1;}

/* ---------- 人物卡 / 餐次行 ---------- */
.person-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.person-emoji{font-size:22px;}
.person-name{
  border:none;background:transparent;padding:4px 0;font-weight:700;font-size:16px;
  border-bottom:1px dashed transparent;border-radius:0;
}
.person-name:focus{border-bottom-color:var(--accent);box-shadow:none;}
.meal-line{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.meal-line:last-child{margin-bottom:0;}
.meal-label{
  font-size:13px;color:var(--muted);flex:0 0 42px;font-weight:600;
}
.meal-input{padding:9px 11px;font-size:15px;border-radius:10px;}

.menu-day.today{border:1.5px solid var(--accent);}
.md-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.md-wd{font-weight:700;font-size:15px;}
.md-date{font-size:12.5px;color:var(--muted);}
.menu-day.today .md-date{color:var(--accent);font-weight:700;}

/* ---------- 购物清单 ---------- */
.add-form input{margin-bottom:8px;}
.row2{display:flex;gap:8px;}
.row2 input{flex:1;min-width:0;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 18px;border-radius:12px;background:var(--accent);color:#fff;
  font-weight:700;font-size:15px;width:100%;
}
.btn:active{opacity:.85;}
.btn.ghost{background:#F4ECE5;color:var(--ink);}
.btn.danger{background:#FFE9E4;color:#D2402A;}
.btn.block{margin-top:2px;}

.shop-item{
  display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);
}
.shop-item:last-child{border-bottom:none;}
.check{
  width:26px;height:26px;border-radius:50%;border:2px solid #E2D5C9;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700;
}
.check.on{background:var(--green);border-color:var(--green);}
.si-main{flex:1;min-width:0;}
.si-name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.shop-item.done .si-name{text-decoration:line-through;color:#BFB2A6;}
.si-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.si-price{font-size:14px;font-weight:700;color:var(--accent);flex:0 0 auto;}
.si-del{color:#D8CBC0;font-size:15px;padding:4px 2px;flex:0 0 auto;}
.summary{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:14px;color:var(--muted);
}
.summary b{font-size:17px;color:var(--ink);}

/* ---------- 营养 ---------- */
.nutri-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.nh-left{display:flex;align-items:center;gap:7px;}
.nh-emoji{font-size:20px;}
.nh-name{font-weight:700;font-size:16px;}
.nh-edit{
  font-size:12.5px;color:var(--accent);font-weight:700;
  padding:5px 10px;background:var(--accent-soft);border-radius:9px;
}
.nh-edit:active{opacity:.7;}
.nh-meta{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
.nr-row{margin-bottom:11px;}
.nr-row:last-child{margin-bottom:0;}
.nr-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:4px;}
.nr-name{font-weight:600;}
.nr-val{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;}
.nr-bar{height:7px;border-radius:4px;background:#F3EBE4;overflow:hidden;}
.nr-bar i{display:block;height:100%;border-radius:4px;transition:width .35s ease;}
.advice{
  margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:13.5px;line-height:1.7;color:#6B5D51;
}
.advice p{margin:0 0 7px;padding-left:15px;position:relative;}
.advice p:last-child{margin-bottom:0;}
.advice p::before{content:'·';position:absolute;left:3px;color:var(--accent);font-weight:800;font-size:16px;line-height:1.4;}
.nutri-tip{
  font-size:12px;color:var(--muted);line-height:1.6;padding:10px 12px;
  background:#FBF4EC;border-radius:10px;margin-bottom:12px;
}

/* ---------- 备份 ---------- */
.stat-row{
  display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  font-size:14px;border-bottom:1px solid var(--line);
}
.stat-row:last-child{border-bottom:none;}
.stat-row span{color:var(--muted);flex:0 0 auto;}
.stat-row b{text-align:right;font-weight:600;line-height:1.4;}

/* ---------- 弹层 ---------- */
#modal{position:fixed;inset:0;z-index:100;display:none;}
#modal.open{display:block;}
.sheet{
  position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
  animation:sheetIn .26s cubic-bezier(.32,.72,0,1);
}
@keyframes sheetIn{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(255,249,244,.95);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  flex:0 0 auto;
}
.sheet-title{font-weight:700;font-size:16px;}
.text-btn{font-size:15px;color:var(--muted);padding:6px 2px;}
.text-btn.strong{color:var(--accent);font-weight:700;}
.sheet-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(40px + env(safe-area-inset-bottom));
}

.photo-pick{
  position:relative;width:100%;height:180px;border-radius:16px;overflow:hidden;
  background:#fff;border:1.5px dashed var(--line);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;
}
.photo-pick img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-empty{text-align:center;color:var(--muted);font-size:13px;}
.photo-empty span{font-size:30px;display:block;margin-bottom:6px;}
.photo-x{
  position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.5);color:#fff;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.4px;}

.ing-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.ing-row .ing-name{flex:1;min-width:0;}
.ing-row .ing-amt{width:92px;flex:0 0 auto;}
.row-del{
  width:32px;height:32px;border-radius:50%;background:#F5EDE6;color:var(--muted);
  font-size:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
}
.step-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;}
.step-no{
  width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;margin-top:9px;
}
.step-row textarea{flex:1;min-height:46px;}
.add-row{
  width:100%;padding:11px;border-radius:12px;background:var(--accent-soft);
  color:var(--accent);font-weight:700;font-size:14px;margin-bottom:6px;
}
.add-row:active{opacity:.8;}

.detail-photo{
  width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;background:#fff;
}
.detail-photo img{width:100%;display:block;max-height:300px;object-fit:cover;}
.detail-title{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:.3px;}
.ing-view-row{
  display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:15px;
}
.ing-view-row:last-child{border-bottom:none;}
.ing-view-row b{color:var(--muted);font-weight:600;flex:0 0 auto;}
.step-view{margin:0;padding-left:20px;font-size:15px;line-height:1.65;}
.step-view li{margin-bottom:10px;padding-left:4px;}
.step-view li::marker{color:var(--accent);font-weight:700;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));
  transform:translate(-50%,12px);
  background:rgba(43,33,24,.93);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:14px;font-weight:500;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:300;max-width:82vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<main id="main">

  <!-- 食谱 -->
  <section class="page active" id="page-recipes">
    <div class="page-head">
      <h1>🥕 家庭食谱</h1>
      <button class="icon-btn" id="addRecipeBtn" aria-label="添加食谱">＋</button>
    </div>
    <div class="page-body">
      <input id="recipeSearch" class="search" placeholder="搜索菜名或食材" oninput="renderRecipes()">
      <div id="recipeList"></div>
    </div>
  </section>

  <!-- 日记 -->
  <section class="page" id="page-diary">
    <div class="page-head"><h1>🍚 饮食日记</h1></div>
    <div class="date-nav" id="diaryNav"></div>
    <div class="page-body" id="diaryBody"></div>
  </section>

  <!-- 营养 -->
  <section class="page" id="page-nutrition">
    <div class="page-head"><h1>🥗 每日营养</h1></div>
    <div class="date-nav" id="nutriNav"></div>
    <div class="page-body" id="nutriBody"></div>
  </section>

  <!-- 菜单 -->
  <section class="page" id="page-menu">
    <div class="page-head"><h1>📅 一周菜单</h1></div>
    <div class="week-nav" id="menuNav"></div>
    <div class="page-body" id="menuBody"></div>
  </section>

  <!-- 购物 -->
  <section class="page" id="page-shopping">
    <div class="page-head"><h1>🛒 购物清单</h1></div>
    <div class="page-body">
      <div class="card">
        <div class="add-form">
          <input id="shopName" placeholder="食材名称，例如：番茄">
          <div class="row2">
            <input id="shopStore" placeholder="超市">
            <input id="shopPrice" type="number" inputmode="decimal" placeholder="价格">
          </div>
          <button class="btn block" id="addShopBtn">加入清单</button>
        </div>
      </div>
      <div class="card" id="shopListCard">
        <div id="shopList"></div>
        <div class="summary" id="shopSummary"></div>
      </div>
    </div>
  </section>

  <!-- 备份 -->
  <section class="page" id="page-backup">
    <div class="page-head"><h1>💾 数据备份</h1></div>
    <div class="page-body">
      <div class="card">
        <div style="font-weight:700;margin-bottom:6px;">导出备份</div>
        <p class="muted" style="margin:0 0 12px;">把全部记录保存为 JSON 文件，换手机或误删时可以恢复。</p>
        <button class="btn" id="exportBtn">导出备份文件</button>
        <div style="height:8px"></div>
        <button class="btn ghost" id="copyBtn">复制备份文本</button>
      </div>

      <div class="card">
        <div style="font-weight:700;margin-bottom:6px;">恢复备份</div>
        <p class="muted" style="margin:0 0 12px;">选择之前导出的 JSON 文件，会覆盖当前全部数据。</p>
        <button class="btn ghost" id="importBtn">选择文件恢复</button>
        <input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
      </div>

      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;">存储情况</div>
        <div id="storageInfo"></div>
        <div style="height:14px"></div>
        <button class="btn danger" id="clearBtn">清空全部数据</button>
      </div>
    </div>
  </section>

</main>

<nav id="tabbar">
  <button class="tab active" data-tab="recipes"><span class="ico">🥕</span>食谱</button>
  <button class="tab" data-tab="diary"><span class="ico">🍚</span>日记</button>
  <button class="tab" data-tab="nutrition"><span class="ico">🥗</span>营养</button>
  <button class="tab" data-tab="menu"><span class="ico">📅</span>菜单</button>
  <button class="tab" data-tab="shopping"><span class="ico">🛒</span>采购</button>
  <button class="tab" data-tab="backup"><span class="ico">💾</span>备份</button>
</nav>

<div id="modal"></div>
<div id="toast"></div>

<script>
/* =========================================================
   工具函数
   ========================================================= */
const KEY = 'myFamilyKitchen.v1';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmt(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}
function todayStr(){ return fmt(new Date()); }
function parseDate(s){
  const p = s.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function addDays(s, n){
  const d = parseDate(s);
  d.setDate(d.getDate() + n);
  return fmt(d);
}
function weekStart(s){
  const d = parseDate(s);
  const wd = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - wd);
  return fmt(d);
}
function fmtMD(s){
  const d = parseDate(s);
  return (d.getMonth() + 1) + '/' + d.getDate();
}

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* =========================================================
   食物营养数据库（每 100g 可食部）
   k=千卡 p=蛋白质g c=碳水g f=脂肪g ca=钙mg fe=铁mg fi=纤维g vc=维Cmg
   s=一份默认克数  a=别名
   ========================================================= */
const FOOD_DB = [
  { n:'米饭', a:['白米饭','大米饭'], k:116, p:2.6, c:25.9, f:0.3, ca:7, fe:1.3, fi:0.3, vc:0, s:150 },
  { n:'面条', a:['挂面','面'], k:110, p:3.9, c:22.0, f:0.4, ca:10, fe:0.9, fi:0.6, vc:0, s:150 },
  { n:'馒头', a:['馍'], k:223, p:7.0, c:47.0, f:1.1, ca:38, fe:1.8, fi:1.3, vc:0, s:100 },

/* ---------- 食物文本解析 ---------- */
function matchFood(tok){
  let count = 1;
  let byGram = false;
  let name = tok;

  const m = tok.match(/^(\d+(?:\.\d+)?)\s*(克|g|ml|毫升)?\s*(.*)$/i);
  if(m){
    count = parseFloat(m[1]);
    const unit = (m[2] || '').toLowerCase();
    name = (m[3] || '').trim();
    if(unit === '克' || unit === 'g' || unit === 'ml' || unit === '毫升') byGram = true;
  }
  if(!name) return null;

  let best = null, bestLen = 0;
  FOOD_DB.forEach(function(f){
    [f.n].concat(f.a || []).forEach(function(nm){
      if(nm.length > bestLen && name.indexOf(nm) >= 0){
        best = f; bestLen = nm.length;
      }
    });
  });
  if(!best) return null;

  let mult;
  if(byGram) mult = count / best.s;
  else if(!m || count <= 10) mult = count;
  else mult = count / best.s;

  return { food: best, mult: mult };
}

function parseFoodText(text){
  const out = { kcal:0, p:0, c:0, f:0, ca:0, fe:0, fi:0, vc:0, matched:[] };
  if(!text) return out;
  const tokens = String(text).split(/[\s,，、+＋;；\/\n]+/).filter(Boolean);
  tokens.forEach(function(tok){
    const hit = matchFood(tok);
    if(!hit) return;
    const f = hit.food;
    const factor = hit.mult * f.s / 100;
    out.kcal += f.k * factor;
    out.p += f.p * factor;
    out.c += f.c * factor;
    out.f += f.f * factor;
    out.ca += f.ca * factor;
    out.fe += f.fe * factor;
    out.fi += f.fi * factor;
    out.vc += f.vc * factor;
    out.matched.push(f.n);
  });
  return out;
}

/* ---------- 营养目标计算 ---------- */
function calcTargets(p){
  const sex = p.sex || '女';
  const age = Math.max(1, +p.age || 30);
  const h = +p.height || 165;
  const w = +p.weight || 55;
  const act = +p.act || 1.4;

  let kcal;
  if(age < 18){
    const table = {
      1:[1000,1000], 2:[1250,1200], 3:[1250,1200], 4:[1400,1300], 5:[1400,1300],
      6:[1600,1500], 7:[1600,1500], 8:[1800,1700], 9:[1800,1700], 10:[2050,1900],
      11:[2050,1900], 12:[2350,2050], 13:[2350,2050], 14:[2500,2200],
      15:[2600,2300], 16:[2800,2400], 17:[2850,2400]
    };
    const t = table[Math.min(17, Math.max(1, Math.round(age)))];
    kcal = sex === '男' ? t[0] : t[1];
  }else{
    const bmr = sex === '男'
      ? 10 * w + 6.25 * h - 5 * age + 5
      : 10 * w + 6.25 * h - 5 * age - 161;
    kcal = bmr * act;
  }

  const protein = age < 18
    ? Math.max(25, w * 1.3)
    : Math.max(50, w * 1.1);

  const fat = kcal * 0.28 / 9;
  const carb = Math.max(100, (kcal - protein * 4 - fat * 9) / 4);

  const ca = age < 4 ? 600 : (age < 11 ? 800 : (age < 18 ? 1000 : 800));
  const fe = age < 4 ? 9 : (age < 11 ? 10 : (age < 18 ? 13 : (sex === '女' ? 18 : 12)));
  const fi = age < 18 ? Math.max(10, Math.min(25, kcal / 1000 * 10)) : 25;
  const vc = age < 4 ? 40 : (age < 11 ? 60 : (age < 18 ? 80 : 100));

  return {
    kcal: Math.round(kcal),
    p: Math.round(protein),
    c: Math.round(carb),
    f: Math.round(fat),
    ca: Math.round(ca),
    fe: Math.round(fe * 10) / 10,
    fi: Math.round(fi),
    vc: Math.round(vc)
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaultState();
    const obj = JSON.parse(raw);
    const s = Object.assign(defaultState(), obj);
    s.names = Object.assign({ me:'我', k1:'宝贝1', k2:'宝贝2' }, obj.names || {});
    s.profiles = Object.assign(defaultProfiles(), obj.profiles || {});
    if(!Array.isArray(s.recipes)) s.recipes = [];
    if(!Array.isArray(s.shopping)) s.shopping = [];
    if(typeof s.diary !== 'object' || !s.diary) s.diary = {};
    if(typeof s.menu !== 'object' || !s.menu) s.menu = {};
    // 同步名字
    ['me','k1','k2'].forEach(function(k){
      if(s.profiles[k] && s.profiles[k].name) s.names[k] = s.profiles[k].name;
    });
    return s;
  }catch(e){
    return defaultState();
  }
}

}

/* =========================================================
   图片压缩
   ========================================================= */
function compressImage(file, maxSide, quality){
  maxSide = maxSide || 900;
  quality = quality || 0.72;
  return new Promise(function(resolve, reject){
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function(){
      try{
        URL.revokeObjectURL(url);
        let w = img.naturalWidth, h = img.naturalHeight;
        const m = Math.max(w, h);
        if(m > maxSide){
          const s = maxSide / m;
          w = Math.round(w * s);
          h = Math.round(h * s);
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      }catch(err){ reject(err); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('load fail')); };
    img.src = url;
  });
}

  $$('.tab').forEach(function(t){

  if(name === 'menu')      renderMenu();
  if(name === 'shopping')  renderShopping();
  if(name === 'backup')    renderBackup();
}

function renderRecipes(){
  const q = ($('#recipeSearch').value || '').trim().toLowerCase();
  const list = state.recipes.filter(function(r){
    if(!q) return true;
    if((r.name || '').toLowerCase().indexOf(q) >= 0) return true;
    return (r.ingredients || []).some(function(i){
      return (i.name || '').toLowerCase().indexOf(q) >= 0;
    });
  });

  const wrap = $('#recipeList');

  if(!list.length){
    wrap.innerHTML =
      '<div class="empty"><div class="empty-ico">🍳</div><p>' +
      (q ? '没有找到相关食谱' : '还没有食谱<br>点右上角 ＋ 添加第一道家常菜') +
      '</p></div>';
    return;
  }

  wrap.innerHTML = list.map(function(r){
    const ing = (r.ingredients || []).length;
    const stp = (r.steps || []).length;
    return '<div class="recipe-card" data-id="' + r.id + '">' +
      '<div class="thumb">' + (r.photo

      '</div>' +
      '<span class="chev">›</span>' +
    '</div>';
  }).join('');
}

    inp.oninput = function(){ draft.ingredients[+inp.dataset.i].name = inp.value; };
  });
  $$('.ing-amt', modal).forEach(function(inp){
    inp.oninput = function(){ draft.ingredients[+inp.dataset.i].amount = inp.value; };
  });
  $$('.step-input', modal).forEach(function(t){
    t.oninput = function(){ draft.steps[+t.dataset.s] = t.value; };
  });

  $$('[data-del-ing]', modal).forEach(function(b){
    b.onclick = function(){
      draft.ingredients.splice(+b.dataset.delIng, 1);
      if(!draft.ingredients.length) draft.ingredients.push({ name:'', amount:'' });
      renderRecipeEdit();
    };
  });
  $$('[data-del-step]', modal).forEach(function(b){
    b.onclick = function(){
      draft.steps.splice(+b.dataset.delStep, 1);
      if(!draft.steps.length) draft.steps.push('');
      renderRecipeEdit();
    };
  });

  $('#addIng').onclick = function(){
    draft.ingredients.push({ name:'', amount:'' });
    renderRecipeEdit();
  };
  $('#addStep').onclick = function(){
    draft.steps.push('');
    renderRecipeEdit();
  };

  $('#photoPick').onclick = function(){ $('#photoInput').click(); };
  $('#photoInput').onchange = function(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    compressImage(f, 900, 0.72).then(function(dataUrl){
      draft.photo = dataUrl;
      renderRecipeEdit();
    }).catch(function(){
      toast('照片读取失败');
    });
  };
  const px = $('#photoX');
  if(px){
    px.onclick = function(ev){
      ev.stopPropagation();
      draft.photo = '';
      renderRecipeEdit();
    };
  }

  const delBtn = $('#delRecipe');
  if(delBtn){
    delBtn.onclick = function(){
      if(!confirm('确定删除「' + (draft.name || '这个食谱') + '」吗？')) return;
      state.recipes = state.recipes.filter(function(x){ return x.id !== draft.id; });
      save();
      draft = null;
      hideModal();
      renderRecipes();
      toast('已删除');
    };
  }
}

function saveRecipe(){
  if(!draft) return;
  const name = (draft.name || '').trim();
  if(!name){ toast('请填写菜名'); return; }

  const rec = {
    id: draft.id,
    name: name,
    photo: draft.photo || '',
    ingredients: draft.ingredients
      .filter(function(i){ return (i.name || '').trim() || (i.amount || '').trim(); })
      .map(function(i){ return { name: (i.name || '').trim(), amount: (i.amount || '').trim() }; }),
    steps: draft.steps.map(function(s){ return (s || '').trim(); }).filter(Boolean)
  };

  const idx = state.recipes.findIndex(function(r){ return r.id === rec.id; });
  if(idx >= 0) state.recipes[idx] = rec;
  else state.recipes.unshift(rec);

  save();
  draft = null;
  hideModal();
  renderRecipes();
  toast('已保存');
}

function shiftNutri(n){
  diaryDate = addDays(diaryDate, n);
  renderNutrition();
}

function pctOf(v, t){
  if(t <= 0) return 0;
  return v / t * 100;
}

function barColor(pct){
  if(pct >= 100) return '#3F9E71';
  if(pct >= 80) return '#6BA84E';
  if(pct >= 50) return '#E8A33D';
  return '#E8785A';
}

function getIntake(personKey, dateStr){
  const day = state.diary[dateStr] || {};
  const rec = day[personKey] || {};
  const text = [rec.b, rec.l, rec.d, rec.s].filter(Boolean).join(' ');
  return parseFoodText(text);
}

function nutriRow(label, val, target, unit, digits){
  const d = digits || 0;
  const pct = pctOf(val, target);
  const w = Math.min(100, Math.round(pct));
  const color = barColor(pct);
  const vTxt = val.toFixed(d);
  const tTxt = target.toFixed(d);
  return '<div class="nr-row">' +
    '<div class="nr-head">' +
      '<span class="nr-name">' + label + '</span>' +
      '<span class="nr-val" style="color:' + (pct >= 100 ? '#3F9E71' : '') + '">' + vTxt + ' / ' + tTxt + ' ' + unit + '</span>' +
    '</div>' +
    '<div class="nr-bar"><i style="width:' + w + '%;background:' + color + '"></i></div>' +
  '</div>';
}

function buildAdvice(t, i){
  if(i.kcal === 0){
    return ['这一天还没有记录吃了什么，去「日记」里填一下，就能看到营养进度啦。'];
  }

  const tips = [];

  if(i.p < t.p * 0.85){
    const gap = Math.max(0, Math.round(t.p - i.p));
    tips.push('蛋白质还差约 ' + gap + 'g，可以加一个鸡蛋（约 6g）、一杯牛奶（约 7g）或一份鸡胸肉。');
  }
  if(i.ca < t.ca * 0.8){
    const gap = Math.max(0, Math.round(t.ca - i.ca));
    tips.push('钙还差约 ' + gap + 'mg，建议加一杯牛奶（约 260mg）或一份豆腐。');
  }
  if(i.fe < t.fe * 0.8){
    const gap = Math.max(0, Math.round((t.fe - i.fe) * 10) / 10);
    tips.push('铁还差约 ' + gap + 'mg，可以吃点瘦肉、猪肝或深绿色蔬菜。');
  }
  if(i.fi < t.fi * 0.7){
    tips.push('膳食纤维偏少，加一份蔬菜或一个苹果会更均衡。');
  }
  if(i.vc < t.vc * 0.7){
    tips.push('维生素 C 偏少，吃个橙子或者一份青椒吧。');
  }
  if(i.kcal < t.kcal * 0.8){
    const gap = Math.max(0, Math.round(t.kcal - i.kcal));
    tips.push('热量还差约 ' + gap + ' kcal，可以再补充一些主食。');
  }
  if(i.kcal > t.kcal * 1.2){
    tips.push('热量已超过目标，注意控制零食和油的用量。');
  }

  if(!tips.length){
    return ['今天各项营养都接近目标，继续保持 👍'];
  }
  return tips.slice(0, 3);
}

function renderNutrition(){
  const nav = $('#nutriNav');
  nav.innerHTML =
    '<button class="nav-btn" onclick="shiftNutri(-1)">‹</button>' +
    '<input type="date" id="nutriDateInput" value="' + diaryDate + '">' +
    '<button class="nav-btn" onclick="shiftNutri(1)">›</button>';

  $('#nutriDateInput').onchange = function(e){
    if(e.target.value){
      diaryDate = e.target.value;
      renderNutrition();
    }
  };

  const people = [
    { k:'me', emoji:'👩', profile: state.profiles.me || {} },
    { k:'k1', emoji:'🧒', profile: state.profiles.k1 || {} },
    { k:'k2', emoji:'👶', profile: state.profiles.k2 || {} }
  ];

  let html = '<div class="nutri-tip">根据身高、体重和年龄估算每日营养目标。食物营养按常见份量自动匹配，结果为估算值，仅供参考。</div>';

  html += people.map(function(x){
    const prof = x.profile;
    const name = prof.name || state.names[x.k] || '成员';
    const t = calcTargets(prof);
    const intake = getIntake(x.k, diaryDate);
    const bmi = prof.weight && prof.height
      ? (prof.weight / Math.pow(prof.height / 100, 2)).toFixed(1)
      : '—';

    const meta = [
      (prof.height || '—') + 'cm',
      (prof.weight || '—') + 'kg',
      'BMI ' + bmi,
      '目标 ' + t.kcal + ' kcal'
    ].join(' · ');

    const advice = buildAdvice(t, intake);

    return '<div class="card">' +
      '<div class="nutri-head">' +
        '<div class="nh-left">' +
          '<span class="nh-emoji">' + x.emoji + '</span>' +
          '<span class="nh-name">' + esc(name) + '</span>' +
        '</div>' +
        '<button class="nh-edit" onclick="openProfileEdit(\'' + x.k + '\')">编辑档案</button>' +
      '</div>' +
      '<div class="nh-meta">' + meta + '</div>' +

      nutriRow('热量', intake.kcal, t.kcal, 'kcal') +
      nutriRow('蛋白质', intake.p, t.p, 'g', 1) +
      nutriRow('碳水化合物', intake.c, t.c, 'g', 1) +
      nutriRow('脂肪', intake.f, t.f, 'g', 1) +
      nutriRow('钙', intake.ca, t.ca, 'mg') +
      nutriRow('铁', intake.fe, t.fe, 'mg', 1) +
      nutriRow('膳食纤维', intake.fi, t.fi, 'g', 1) +
      nutriRow('维生素 C', intake.vc, t.vc, 'mg') +

      '<div class="advice">' +
        advice.map(function(a){ return '<p>' + esc(a) + '</p>'; }).join('') +
      '</div>' +
    '</div>';
  }).join('');

  $('#nutriBody').innerHTML = html;
}

function addShopItem(){
  const name = ($('#shopName').value || '').trim();
  if(!name){ toast('请填写食材名称'); $('#shopName').focus(); return; }
  const store = ($('#shopStore').value || '').trim();
  const priceRaw = $('#shopPrice').value;
  const price = priceRaw ? Number(priceRaw) : 0;

  state.shopping.unshift({
    id: uid(),
    name: name,
    store: store,
    price: isNaN(price) ? 0 : price,
    done: false
  });
  save();
  renderShopping();

  $('#shopName').value = '';
  $('#shopStore').value = '';
  $('#shopPrice').value = '';
  $('#shopName').focus();
}

function toggleShop(id){
  const it = state.shopping.find(function(x){ return x.id === id; });
  if(!it) return;
  it.done = !it.done;
  save();
  renderShopping();
}

function delShop(id){
  state.shopping = state.shopping.filter(function(x){ return x.id !== id; });
  save();
  renderShopping();
}

function renderShopping(){
  const items = state.shopping;
  const list = $('#shopList');
  const sum = $('#shopSummary');

  if(!items.length){
    list.innerHTML =
      '<div class="empty" style="padding:34px 10px;">' +
        '<div class="empty-ico">🧺</div><p>清单是空的<br>上面添加要买的东西吧</p>' +
      '</div>';
    sum.innerHTML = '';
    return;
  }

  list.innerHTML = items.map(function(it){
    return '<div class="shop-item' + (it.done ? ' done' : '') + '">' +
      '<button class="check' + (it.done ? ' on' : '') + '" onclick="toggleShop(\'' + it.id + '\')">' +
        (it.done ? '✓' : '') + '</button>' +
      '<div class="si-main">' +
        '<div class="si-name">' + esc(it.name) + '</div>' +
        (it.store ? '<div class="si-meta">' + esc(it.store) + '</div>' : '') +
      '</div>' +
      '<div class="si-price">' + (Number(it.price) ? '¥' + Number(it.price).toFixed(2) : '') + '</div>' +
      '<button class="si-del" onclick="delShop(\'' + it.id + '\')">✕</button>' +
    '</div>';
  }).join('');

  const total = items.reduce(function(s, i){ return s + (Number(i.price) || 0); }, 0);
  const doneCount = items.filter(function(i){ return i.done; }).length;

  sum.innerHTML =
    '<span>已买 ' + doneCount + ' / ' + items.length + ' 项</span>' +
    '<b>合计 ¥' + total.toFixed(2) + '</b>';
}

$('#addShopBtn').addEventListener('click', addShopItem);
$('#shopPrice').addEventListener('keydown', function(e){
  if(e.key === 'Enter') addShopItem();
});

function exportData(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '家庭食谱备份-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1200);
  toast('已导出备份文件');
}

function copyData(){
  const text = JSON.stringify(state);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast('备份内容已复制');
    }).catch(function(){
      fallbackCopy(text);
    });
  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  showModal(
    '<div class="sheet-head">' +
      '<button class="text-btn" id="cpBack">关闭</button>' +
      '<div class="sheet-title">复制备份文本</div>' +
      '<span style="width:36px"></span>' +
    '</div>' +
    '<div class="sheet-body">' +
      '<p class="muted">长按下面的文本，选择「全选 → 拷贝」，粘贴到备忘录或微信里保存。</p>' +
      '<textarea id="cpText" rows="14" style="font-size:12px;font-family:ui-monospace,Menlo,monospace;">' +
        esc(text) +
      '</textarea>' +
    '</div>'
  );
  $('#cpBack').onclick = hideModal;
  setTimeout(function(){
    const ta = $('#cpText');
    if(ta){ ta.focus(); ta.select(); }
  }, 120);
}

function importData(file){
  const reader = new FileReader();
  reader.onload = function(){
    let obj = null;
    try{
      obj = JSON.parse(reader.result);
    }catch(e){
      toast('文件格式不正确');
      return;
    }
    if(!obj || typeof obj !== 'object' || Array.isArray(obj)){
      toast('文件格式不正确');
      return;
    }
    if(!confirm('恢复备份会覆盖当前全部数据，确定继续吗？')) return;

    state = Object.assign(defaultState(), obj);
    state.names = Object.assign({ me:'我', k1:'宝贝1', k2:'宝贝2' }, obj.names || {});
    state.profiles = Object.assign(defaultProfiles(), obj.profiles || {});
    if(!Array.isArray(state.recipes)) state.recipes = [];
    if(!Array.isArray(state.shopping)) state.shopping = [];
    if(typeof state.diary !== 'object' || !state.diary) state.diary = {};
    if(typeof state.menu !== 'object' || !state.menu) state.menu = {};

    ['me','k1','k2'].forEach(function(k){
      if(state.profiles[k] && state.profiles[k].name) state.names[k] = state.profiles[k].name;
    });

    save();
    diaryDate = todayStr();
    weekAnchor = weekStart(todayStr());
    switchTab('recipes');
    toast('恢复成功');
  };
  reader.onerror = function(){ toast('文件读取失败'); };
  reader.readAsText(file);
}

$('#exportBtn').addEventListener('click', exportData);
$('#copyBtn').addEventListener('click', copyData);

$('#importBtn').addEventListener('click', function(){
  $('#importFile').click();
});

$('#importFile').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  if(f) importData(f);
  e.target.value = '';
});

$('#clearBtn').addEventListener('click', function(){
  if(!confirm('确定清空全部数据吗？此操作不可撤销，建议先导出备份。')) return;
  if(!confirm('再确认一次：所有食谱、日记、菜单、购物清单和营养档案都会被删除。')) return;
  state = defaultState();
  state.recipes = [];
  save();
  diaryDate = todayStr();
  weekAnchor = weekStart(todayStr());
  switchTab('recipes');
  toast('已清空全部数据');
});

/* =========================================================
   启动
   ========================================================= */
renderRecipes();
renderDiary();
renderNutrition();
renderMenu();
renderShopping();
renderBackup();

/* 防止 iOS 双击缩放 */
let lastTouch = 0;
document.addEventListener('touchend', function(e){
  const now = Date.now();
  if(now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>
